        @keyframes fadeIn {

            to { opacity: 1; transform: translateY(0); }

                        }
                    }
                }

        }
    </script>
    <style>@view-transition { navigation: auto; }</style>
    <script src="/_sdk/data_sdk.js" type="text/javascript"></script>
</head>
<body class="h-full w-full m-0 p-0">
<div class="w-full min-h-full bg-wood-50 dark:bg-wood-950 smooth-transition">
    <div class="max-w-7xl mx-auto px-4 py-8 sm:px-6 lg:px-8"><!-- Header -->
        <div class="flex items-center justify-between mb-8">
            <h1 id="page-title" class="text-3xl font-bold text-wood-900 dark:text-wood-100">سبد خرید</h1><button id="theme-toggle" class="p-2 rounded-lg bg-wood-200 dark:bg-wood-800 text-wood-800 dark:text-wood-200 hover:bg-wood-300 dark:hover:bg-wood-700 smooth-transition" aria-label="Toggle dark mode">
            <svg id="sun-icon" class="w-6 h-6 hidden dark:block" fill="none" stroke="currentColor" viewbox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z" />
            </svg>
            <svg id="moon-icon" class="w-6 h-6 block dark:hidden" fill="none" stroke="currentColor" viewbox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z" />
            </svg></button>
        </div>
        <div class="grid grid-cols-1 lg:grid-cols-3 gap-8"><!-- Cart Items Section -->
            <div class="lg:col-span-2">
                <h2 id="cart-section-title" class="text-2xl font-semibold text-wood-900 dark:text-wood-100 mb-6">محصولات شما</h2>
                <div id="cart-items" class="space-y-4"><!-- Cart items will be rendered here -->
                </div>
            </div>
            <!-- Address Section -->
            <div class="lg:col-span-1">
                <div class="bg-white dark:bg-wood-900 rounded-xl shadow-lg p-6 sticky top-8">
                    <h2 id="address-section-title" class="text-2xl font-semibold text-wood-900 dark:text-wood-100 mb-6">آدرس تحویل</h2><!-- Saved Addresses -->
                    <div class="mb-6"><label for="saved-addresses" class="block text-sm font-medium text-wood-700 dark:text-wood-300 mb-2">انتخاب آدرس ذخیره شده</label> <select id="saved-addresses" class="w-full px-4 py-3 rounded-lg border-2 border-wood-300 dark:border-wood-700 bg-wood-50 dark:bg-wood-800 text-wood-900 dark:text-wood-100 focus:border-wood-500 dark:focus:border-wood-500 focus:outline-none smooth-transition"> <option value="">انتخاب آدرس...</option> <option value="home">منزل - تهران، خیابان ولیعصر، پلاک ۱۲۳</option> <option value="work">محل کار - تهران، میدان ونک، برج سپهر، طبقه ۱۰</option> </select>
                    </div><button type="button" id="new-address-toggle" class="w-full py-3 px-4 bg-wood-100 dark:bg-wood-800 text-wood-700 dark:text-wood-300 rounded-lg hover:bg-wood-200 dark:hover:bg-wood-700 smooth-transition flex items-center justify-between mb-6"> <span>آدرس جدید وارد کنید</span>
                    <svg id="toggle-icon" class="w-5 h-5 smooth-transition" fill="none" stroke="currentColor" viewbox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7" />
                    </svg></button> <!-- Address Form -->
                    <form id="address-form" class="space-y-4 hidden overflow-hidden" style="max-height: 0; opacity: 0; transition: max-height 0.4s ease, opacity 0.3s ease;">
                        <div><label for="province" class="block text-sm font-medium text-wood-700 dark:text-wood-300 mb-2">استان</label> <select id="province" class="w-full px-4 py-3 rounded-lg border-2 border-wood-300 dark:border-wood-700 bg-wood-50 dark:bg-wood-800 text-wood-900 dark:text-wood-100 focus:border-wood-500 dark:focus:border-wood-500 focus:outline-none smooth-transition"> <option value="">انتخاب استان...</option> <option value="تهران">تهران</option> <option value="ا����فهان">اصفهان</option> <option value="فارس">فارس</option> <option value="خراسان رضوی">خراسان رضوی</option> <option value="آذربایجان شرقی">آذربایجان شرقی</option> <option value="مازندران">مازندران</option> <option value="گیلان">گیلان</option> <option value="کرمان">کرمان</option> <option value="یزد">یزد</option> <option value="قم">قم</option> </select>
                        </div>
                        <div><label for="city" class="block text-sm font-medium text-wood-700 dark:text-wood-300 mb-2">شهر</label> <input type="text" id="city" placeholder="نام شهر را وارد کنید" class="w-full px-4 py-3 rounded-lg border-2 border-wood-300 dark:border-wood-700 bg-wood-50 dark:bg-wood-800 text-wood-900 dark:text-wood-100 placeholder-wood-400 dark:placeholder-wood-600 focus:border-wood-500 dark:focus:border-wood-500 focus:outline-none smooth-transition">
                        </div>
                        <div><label for="postal-code" class="block text-sm font-medium text-wood-700 dark:text-wood-300 mb-2">کد پستی</label> <input type="text" id="postal-code" placeholder="۱۲۳۴۵۶۷۸۹۰" class="w-full px-4 py-3 rounded-lg border-2 border-wood-300 dark:border-wood-700 bg-wood-50 dark:bg-wood-800 text-wood-900 dark:text-wood-100 placeholder-wood-400 dark:placeholder-wood-600 focus:border-wood-500 dark:focus:border-wood-500 focus:outline-none smooth-transition">
                        </div>
                        <div><label for="address" class="block text-sm font-medium text-wood-700 dark:text-wood-300 mb-2">آدرس کامل</label> <textarea id="address" rows="3" placeholder="آدرس کامل خود را وارد کنید" class="w-full px-4 py-3 rounded-lg border-2 border-wood-300 dark:border-wood-700 bg-wood-50 dark:bg-wood-800 text-wood-900 dark:text-wood-100 placeholder-wood-400 dark:placeholder-wood-600 focus:border-wood-500 dark:focus:border-wood-500 focus:outline-none smooth-transition resize-none"></textarea>
                        </div><!-- Order Summary -->
                        <div class="pt-4 border-t border-wood-300 dark:border-wood-700">
                            <div class="flex justify-between text-wood-700 dark:text-wood-300 mb-2"><span>جمع جزء</span> <span id="subtotal">۰ تومان</span>
                            </div>
                            <div class="flex justify-between text-wood-700 dark:text-wood-300 mb-2"><span>هزینه ارسال</span> <span id="shipping">��۰,۰۰۰ تومان</span>
                            </div>
                            <div class="flex justify-between text-lg font-bold text-wood-900 dark:text-wood-100 pt-2 border-t border-wood-300 dark:border-wood-700"><span>جمع کل</span> <span id="total">۰ تومان</span>
                            </div>
                        </div><button type="submit" id="checkout-button" class="w-full py-4 px-6 bg-wood-600 hover:bg-wood-700 text-white font-semibold rounded-lg smooth-transition shadow-lg hover:shadow-xl"> ادامه فرآیند خرید </button>
                    </form>
                </div>
            </div>
        </div>
    </div><!-- Success Toast -->
    <div id="toast" class="fixed top-4 right-4 bg-wood-700 text-white px-6 py-4 rounded-lg shadow-xl hidden animate-fade-in">
        <p id="toast-message">آدرس با موفقیت ذخیره شد!</p>
    </div>
</div>
<script>
    const defaultConfig = {
        page_title: 'سبد خرید',
        cart_section_title: 'محصولات شما',
        address_section_title: 'آدرس تحویل',
        button_text: 'ادامه فرآیند خرید',
        background_color: '#fdf8f3',
        surface_color: '#ffffff',
        text_color: '#4a2f1f',
        primary_action_color: '#b8935f',
        secondary_action_color: '#9c7a52',
        font_family: 'Tahoma, Arial, sans-serif',
        font_size: 16
    };

    let config = {};

    // Sample cart data
    const cartItems = [
        { id: 1, name: 'میز جلو مبلی چوبی', price: 12500000, quantity: 1, image: '🪑' },
        { id: 2, name: 'قفسه کتاب دست‌ساز', price: 18900000, quantity: 1, image: '📚' },
        { id: 3, name: 'صند��ی غذاخوری بلوط', price: 6750000, quantity: 2, image: '🪑' }
    ];

    function formatPrice(price) {
        return price.toString().replace(/\B(?=(\d{3})+(?!\d))/g, ',');
    }

    function renderCartItems() {
        const container = document.getElementById('cart-items');
        container.innerHTML = cartItems.map(item => `
                <div class="bg-white dark:bg-wood-900 rounded-xl shadow-md p-6 flex items-center gap-6 smooth-transition hover:shadow-lg">
                    <div class="text-5xl">${item.image}</div>
                    <div class="flex-1">
                        <h3 class="font-semibold text-lg text-wood-900 dark:text-wood-100">${item.name}</h3>
                        <p class="text-wood-600 dark:text-wood-400 mt-1">${formatPrice(item.price)} تومان</p>
                    </div>
                    <div class="flex items-center gap-3">
                        <button onclick="updateQuantity(${item.id}, -1)" class="w-8 h-8 rounded-lg bg-wood-200 dark:bg-wood-800 text-wood-800 dark:text-wood-200 hover:bg-wood-300 dark:hover:bg-wood-700 smooth-transition flex items-center justify-center font-bold">−</button>
                        <span class="w-8 text-center font-semibold text-wood-900 dark:text-wood-100">${item.quantity}</span>
                        <button onclick="updateQuantity(${item.id}, 1)" class="w-8 h-8 rounded-lg bg-wood-200 dark:bg-wood-800 text-wood-800 dark:text-wood-200 hover:bg-wood-300 dark:hover:bg-wood-700 smooth-transition flex items-center justify-center font-bold">+</button>
                    </div>
                    <button onclick="removeItem(${item.id})" class="text-wood-500 hover:text-wood-700 dark:hover:text-wood-300 smooth-transition" aria-label="حذف محصول">
                        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/>
                        </svg>
                    </button>
                </div>
            `).join('');
        updateTotals();
    }

    function updateQuantity(id, change) {
        const item = cartItems.find(i => i.id === id);
        if (item) {
            item.quantity = Math.max(0, item.quantity + change);
            if (item.quantity === 0) {
                removeItem(id);
            } else {
                renderCartItems();
            }
        }
    }

    function removeItem(id) {
        const index = cartItems.findIndex(i => i.id === id);
        if (index > -1) {
            cartItems.splice(index, 1);
            renderCartItems();
        }
    }

    function updateTotals() {
        const subtotal = cartItems.reduce((sum, item) => sum + (item.price * item.quantity), 0);
        const shipping = 50000;
        const total = subtotal + shipping;

        document.getElementById('subtotal').textContent = `${formatPrice(subtotal)} تومان`;
        document.getElementById('total').textContent = `${formatPrice(total)} تومان`;
    }

    // Theme toggle
    document.getElementById('theme-toggle').addEventListener('click', () => {
        document.documentElement.classList.toggle('dark');
        localStorage.setItem('theme', document.documentElement.classList.contains('dark') ? 'dark' : 'light');
    });

    // Load saved theme
    if (localStorage.getItem('theme') === 'dark') {
        document.documentElement.classList.add('dark');
    }

    // New address toggle
    let isFormVisible = false;
    document.getElementById('new-address-toggle').addEventListener('click', () => {
        const form = document.getElementById('address-form');
        const icon = document.getElementById('toggle-icon');

        isFormVisible = !isFormVisible;

        if (isFormVisible) {
            form.classList.remove('hidden');
            setTimeout(() => {
                form.style.maxHeight = '1000px';
                form.style.opacity = '1';
            }, 10);
            icon.style.transform = 'rotate(180deg)';
        } else {
            form.style.maxHeight = '0';
            form.style.opacity = '0';
            setTimeout(() => {
                form.classList.add('hidden');
            }, 400);
            icon.style.transform = 'rotate(0deg)';
        }
    });

    // Saved address selection
    document.getElementById('saved-addresses').addEventListener('change', (e) => {
        const form = document.getElementById('address-form');
        if (e.target.value === 'home') {
            document.getElementById('province').value = 'تهران';
            document.getElementById('city').value = 'تهران';
            document.getElementById('postal-code').value = '1234567890';
            document.getElementById('address').value = 'خیابان ولیعصر، نرسیده به میدان ونک، پلاک ۱۲۳، واحد ۴';
        } else if (e.target.value === 'work') {
            document.getElementById('province').value = 'تهران';
            document.getElementById('city').value = 'تهران';
            document.getElementById('postal-code').value = '9876543210';
            document.getElementById('address').value = 'میدان ونک، برج سپهر، طبقه ۱۰، واحد ۲۰۰';
        } else {
            form.reset();
        }
    });

    // Form submission
    document.getElementById('address-form').addEventListener('submit', (e) => {
        e.preventDefault();

        const province = document.getElementById('province').value;
        const city = document.getElementById('city').value;
        const postalCode = document.getElementById('postal-code').value;
        const address = document.getElementById('address').value;

        if (!province || !city || !postalCode || !address) {
            showToast('لطفاً تمام فیلدهای آدرس را پر کنید');
            return;
        }

        showToast('سفارش شما با موفقیت ثبت شد! 🎉');
        setTimeout(() => {
            document.getElementById('address-form').reset();
            document.getElementById('saved-addresses').value = '';
        }, 1500);
    });

    function showToast(message) {
        const toast = document.getElementById('toast');
        const toastMessage = document.getElementById('toast-message');
        toastMessage.textContent = message;
        toast.classList.remove('hidden');
        setTimeout(() => {
            toast.classList.add('hidden');
        }, 3000);
    }

    async function onConfigChange(config) {
        const baseSize = config.font_size || defaultConfig.font_size;
        const fontFamily = config.font_family || defaultConfig.font_family;

        document.getElementById('page-title').textContent = config.page_title || defaultConfig.page_title;
        document.getElementById('cart-section-title').textContent = config.cart_section_title || defaultConfig.cart_section_title;
        document.getElementById('address-section-title').textContent = config.address_section_title || defaultConfig.address_section_title;
        document.getElementById('checkout-button').textContent = config.button_text || defaultConfig.button_text;

        // Apply font family
        document.body.style.fontFamily = `${fontFamily}, Tahoma, Arial, sans-serif`;

        // Apply font sizes
        document.getElementById('page-title').style.fontSize = `${baseSize * 1.875}px`;
        document.getElementById('cart-section-title').style.fontSize = `${baseSize * 1.5}px`;
        document.getElementById('address-section-title').style.fontSize = `${baseSize * 1.5}px`;
        document.body.style.fontSize = `${baseSize}px`;
    }

    if (window.elementSdk) {
        window.elementSdk.init({
            defaultConfig,
            onConfigChange,
            mapToCapabilities: (config) => ({
                recolorables: [
                    {
                        get: () => config.background_color || defaultConfig.background_color,
                        set: (value) => {
                            config.background_color = value;
                            window.elementSdk.setConfig({ background_color: value });
                        }
                    },
                    {
                        get: () => config.surface_color || defaultConfig.surface_color,
                        set: (value) => {
                            config.surface_color = value;
                            window.elementSdk.setConfig({ surface_color: value });
                        }
                    },
                    {
                        get: () => config.text_color || defaultConfig.text_color,
                        set: (value) => {
                            config.text_color = value;
                            window.elementSdk.setConfig({ text_color: value });
                        }
                    },
                    {
                        get: () => config.primary_action_color || defaultConfig.primary_action_color,
                        set: (value) => {
                            config.primary_action_color = value;
                            window.elementSdk.setConfig({ primary_action_color: value });
                        }
                    },
                    {
                        get: () => config.secondary_action_color || defaultConfig.secondary_action_color,
                        set: (value) => {
                            config.secondary_action_color = value;
                            window.elementSdk.setConfig({ secondary_action_color: value });
                        }
                    }
                ],
                borderables: [],
                fontEditable: {
                    get: () => config.font_family || defaultConfig.font_family,
                    set: (value) => {
                        config.font_family = value;
                        window.elementSdk.setConfig({ font_family: value });
                    }
                },
                fontSizeable: {
                    get: () => config.font_size || defaultConfig.font_size,
                    set: (value) => {
                        config.font_size = value;
                        window.elementSdk.setConfig({ font_size: value });
                    }
                }
            }),
            mapToEditPanelValues: (config) => new Map([
                ['page_title', config.page_title || defaultConfig.page_title],
                ['cart_section_title', config.cart_section_title || defaultConfig.cart_section_title],
                ['address_section_title', config.address_section_title || defaultConfig.address_section_title],
                ['button_text', config.button_text || defaultConfig.button_text]
            ])
        });
        config = window.elementSdk.config;
    }

    // Initialize
    renderCartItems();
</script>
